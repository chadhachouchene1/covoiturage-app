services:
  backend:
    image: chouchenechadha/covoiturage-backend:latest
    container_name: covoiturage-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    networks:
      - covoiturage-network

  frontend:
    image: chouchenechadha/covoiturage-frontend:latest
    container_name: covoiturage-frontend
    restart: always
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - covoiturage-network

networks:
  covoiturage-network:
    driver: bridge