name: frontend-pipeline

on:
  push:
    branches:
      - main
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: self-hosted

    steps:
      - name: clone code repository
        uses: actions/checkout@v4

      - name: build docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            --build-arg VITE_SOCKET_URL=${{ secrets.VITE_SOCKET_URL }} \
            -t chouchenechadha/covoiturage-frontend:${{ github.sha }} .
        working-directory: ./front-end

      - name: check image
        run: docker images

      - name: log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: push docker image
        run: |
          docker push chouchenechadha/covoiturage-frontend:${{ github.sha }}
          docker tag chouchenechadha/covoiturage-frontend:${{ github.sha }} chouchenechadha/covoiturage-frontend:latest
          docker push chouchenechadha/covoiturage-frontend:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: deploy via ssh
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd ~/svc_core/devops-script

            docker-compose down --remove-orphans || true

            docker pull chouchenechadha/covoiturage-frontend:latest

            docker-compose up -d --force-recreate